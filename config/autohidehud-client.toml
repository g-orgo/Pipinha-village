	# Default: 0
	# Range: 0 ~ 360
	hotbarRotation = 0
	#Per-element rotation added on top of global; also applied to AppleSkin health overlays
	# Default: 0
	# Range: 0 ~ 360
	healthBarRotation = 0
	#Per-element rotation added on top of global
	# Default: 0
	# Range: 0 ~ 360
	armorRotation = 0
	#Per-element rotation added on top of global; also applied to AppleSkin food/saturation overlays
	# Default: 0
	# Range: 0 ~ 360
	foodRotation = 0
	#Per-element rotation added on top of global
	# Default: 0
	# Range: 0 ~ 360
	airRotation = 0
	#Per-element rotation added on top of global
	# Default: 0
	# Range: 0 ~ 360
	vehicleHealthRotation = 0
	#Per-element rotation added on top of global
	# Default: 0
	# Range: 0 ~ 360
	experienceLevelRotation = 0
	#Per-element rotation added on top of global
	# Default: 0
	# Range: 0 ~ 360
