	#Global Y offset applied to all core HUD elements (positive moves down toward bottom of screen)
	# Default: 0
	# Range: -500 ~ 500
	globalOffsetY = 0
	#Per-element X offset added on top of global
	# Default: 0
	# Range: -500 ~ 500
	hotbarOffsetX = 0
	#Per-element Y offset added on top of global
