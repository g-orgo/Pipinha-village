	#Per-element Y offset added on top of global; also applied to AppleSkin health overlays
	# Default: 0
	# Range: -500 ~ 500
	healthBarOffsetY = 0
	#Per-element X offset added on top of global
	# Default: 0
	# Range: -500 ~ 500
	armorOffsetX = 0
	#Per-element Y offset added on top of global
	# Default: 0
	# Range: -500 ~ 500
	armorOffsetY = 0
	#Per-element X offset added on top of global; also applied to AppleSkin food/saturation overlays
	# Default: 0
	# Range: -500 ~ 500
	foodOffsetX = 0
	#Per-element Y offset added on top of global; also applied to AppleSkin food/saturation overlays
	# Default: 0
	# Range: -500 ~ 500
	foodOffsetY = 0
	#Per-element X offset added on top of global
	# Default: 0
	# Range: -500 ~ 500
	airOffsetX = 0
	#Per-element Y offset added on top of global
	# Default: 0
	# Range: -500 ~ 500
	airOffsetY = 0
	#Per-element X offset added on top of global
	# Default: 0
	# Range: -500 ~ 500
