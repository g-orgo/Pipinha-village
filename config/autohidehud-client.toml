	#Per-element Y offset added on top of global
	# Default: 0
	# Range: -500 ~ 500
	experienceLevelOffsetY = 0
	#Per-element X offset added on top of global
	# Default: 0
	# Range: -500 ~ 500
	selectedItemNameOffsetX = 0
	#Per-element Y offset added on top of global
	# Default: 0
	# Range: -500 ~ 500
	selectedItemNameOffsetY = 0
	#X offset for status effects (top-right cluster); global offset does NOT apply
	# Default: 0
	# Range: -500 ~ 500
	statusEffectsOffsetX = 0
	#Y offset for status effects (top-right cluster); global offset does NOT apply
	# Default: 0
	# Range: -500 ~ 500
	statusEffectsOffsetY = 0
	#X offset for chat; global offset does NOT apply
	# Default: 0
	# Range: -500 ~ 500
